# ============================================================================ #
# === mass_summons
#
# The idea here is to gather as many summonables as possible. This also
# includes having as many summonable characters as possible - this
# qualifies for clerics, mages, druids and so forth.
#
#   (1) recruit Aura and get her automaton
#   (2) grab the berserker figurine
#   (3) recruit Paina and obtain the spider
#   (4) obtain Jazon
#   (5) get the djinni figurine
#   (6) get Afaaq Djinni
#   (7) get the thief-summon from Wares of the Plane
#   (8) get gilbertus-spider
#   (9) Play with Fall as well
#
# A few more ideas may be added to this here lateron.
# ============================================================================ #
