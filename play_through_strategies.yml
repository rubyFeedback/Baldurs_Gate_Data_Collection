# === mass_summons
#
# The idea here is to gather as many summonables as possible. This also
# includes having as many summonable characters as possible - this
# qualifies for clerics, mages, druids and so forth.
#
#    (1) obtain Jazon from the graveyard district
#    (2) recruit Aura and get her automaton
#    (3) recruit Paina and obtain the spider
#    (4) grab the berserker figurine
#    (5) get Afaaq Djinni
#    (6) get the djinni figurine from the trading dao djinni
#    (7) get the thief-summon from Wares of the Plane
#    (8) get the gilbertus-spider
#    (9) Play with Fall as well, perhaps as a main char hmmmmm.
#   (10) get all golems, 3 of them
