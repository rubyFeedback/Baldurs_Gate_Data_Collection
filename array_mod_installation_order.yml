# ============================================================================ #
# === Installation order of mods
#
# Typically this is a good idea to approach the installation order:
#
#   - quests
#   - NPC mods and NPC additions
#   - Items
#   - Kit mods
#   - Tweaks and AI near the end.
#   - Powergaming scripts should go last.
#
# ============================================================================ #

# ============================================================================ #
# Next party should be:
#
#   psionic, Korgan, Dusk, Drizzt, Aura and Edwin.
#   tripler, Korgan, Dusk, Drizzt, Aura and Aerie.
#
# Also test https://github.com/bucketfulofsunshine/baldurian-bar-hop once
# it is ready.
# ============================================================================ #

