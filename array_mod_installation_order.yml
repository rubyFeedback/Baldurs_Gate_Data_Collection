# ============================================================================ #
# === array_mod_installation_order.yml
#
# This file is only allowed to specify the installation order of
# mods. The real complexity of each entry here, is kept in
# another .yml file.
#
# Note that each entry here must be a Symbol.
#
# There are currently two listings: the first one is the current numbering,
# the second one the old, final listing. In the long run I may return to
# the second listing, but for now the first listing applies.
# ============================================================================ #
# Games.file_array_mod_installation_order
# ============================================================================ #

# ============================================================================ #
# === Installation order of mods
#
# Typically this is a good idea to approach the installation order:
#
#   - quests
#   - NPC mods and NPC additions
#   - Items
#   - Kit mods
#   - Tweaks and AI near the end.
#   - Powergaming scripts should go last.
#
# ============================================================================ #
# For the next run try the ajoc mod; also test the Ink Gallery, and
# the Duality_Odd_Quest_Mod and the psionics mod.
#
# Party should be: zerker-katana-mage as main, Korgan, Dusk, Drizzt,
#                  Aura and Viconia. Korgan with hammer+axe or so.
# ============================================================================ #

- !ruby/symbol EET_from_Gibberlings3                             #  (1) EET Mod.
- !ruby/symbol Graphical_Overhaul                                #  (2) Graphical Overhaul Mod.
- !ruby/symbol Unfinished_Business_mod                           #  (3) Unfinished Business Mod. Should be installed early on.

